services:
  mysql:
    image: mysql:8.4
    container_name: aegis-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: aegis
      MYSQL_USER: aegis
      MYSQL_PASSWORD: aegis_secret
      MYSQL_ROOT_PASSWORD: root_secret

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_secret"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: